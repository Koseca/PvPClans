clan:
  summon:
    # Configure summon cooldown in minutes (only). Default: 120 (2 hours).
    cooldown-minutes: 120    # cooldown for /clan summon in minutes
    cost-trophies: 5         # trophies removed from the summoner
    warmup-seconds: 5
  max-members: 3
  name-min: 3
  name-max: 6
  disband-confirm-seconds: 10
  allowed-regex: "^[a-zA-Z0-9_]+$"
  top-size: 10 # how many clans to be displayed in the /clan top command
  base-warmup-seconds: 5
  join-cooldown-hours: 2
  levels:
    # index 1.N (max 10). value = trophies required to reach that level
    # Example: level 1 at 0 trophies, level 2 at 10 trophies, etc.
    thresholds:
      - 0
      - 10
      - 25
      - 50
      - 90
      - 140
      - 200
      - 275
      - 365
      - 470
    # Per-level prefix templates. Index 0 = level 1, index 9 = level 10.
    # Use %clan% inside the template to inject the clan name.
    prefixes:
      - "&8[&b%clan%&8] &7"    # level 1
      - "&8[&6%clan%&8] &7"    # level 2
      - "&8[&a%clan%&8] &7"    # level 3
      - "&8[&e%clan%&8] &7"    # level 4
      - "&8[&c%clan%&8] &7"    # level 5
      - "&8[&d%clan%&8] &7"    # level 6
      - "&8[&9%clan%&8] &7"    # level 7
      - "&8[&5%clan%&8] &7"    # level 8
      - "&8[&3%clan%&8] &7"    # level 9
      - "&l&c[%clan%] &7"     # level 10 (bold red [Clan Name])
    commands:
      summon-required-level: 2
      setbase-required-level: 3

